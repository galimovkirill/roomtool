openapi: "3.0.3"
info:
  title: RoomTool API
  version: "1.0.0"
  description: REST API for RoomTool wardrobe designer

paths:
  /health:
    get:
      operationId: GetHealth
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/auth/register:
    post:
      operationId: Register
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/login:
    post:
      operationId: Login
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/logout:
    post:
      operationId: Logout
      summary: Log out
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Logged out
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/refresh:
    post:
      operationId: RefreshToken
      summary: Refresh access token using refresh token cookie
      responses:
        "204":
          description: Tokens refreshed
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/me:
    get:
      operationId: GetCurrentUser
      summary: Get current user info
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/scenes:
    get:
      operationId: ListScenes
      summary: List all scenes
      security:
        - cookieAuth: []
      responses:
        "200":
          description: List of scenes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SceneSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: CreateScene
      summary: Create a new scene
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneInput"
      responses:
        "201":
          description: Scene created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scene"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/scenes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: GetScene
      summary: Get a scene by ID
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Scene found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scene"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Scene not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: UpdateScene
      summary: Update a scene
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneInput"
      responses:
        "200":
          description: Scene updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scene"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Scene not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: RenameScene
      summary: Rename a scene (update name only)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneRenameInput"
      responses:
        "200":
          description: Scene renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scene"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Scene not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: DeleteScene
      summary: Delete a scene
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Scene deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Scene not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/scenes/{id}/duplicate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: DuplicateScene
      summary: Duplicate a scene
      security:
        - cookieAuth: []
      responses:
        "201":
          description: Scene duplicated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scene"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Scene not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/scenes/{id}/share:
    parameters:
      - $ref: "#/components/parameters/SceneId"
    post:
      operationId: EnableShare
      summary: Enable sharing (idempotent)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Share token (existing or newly created)
          content:
            application/json:
              schema:
                type: object
                required: [share_token]
                properties:
                  share_token:
                    type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: DisableShare
      summary: Revoke sharing
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Sharing revoked
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/share/{token}:
    get:
      operationId: GetPublicScene
      summary: Get public scene by share token (no auth required)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scene data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scene"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    SceneId:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          description: User ID (UUID)
        email:
          type: string
          format: email

    AuthRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    SceneSummary:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: Unique identifier (UUID)
        name:
          type: string
          description: Human-readable scene name
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        share_token:
          type: string
          nullable: true
          description: >
            Opaque share token. Non-null means the scene is publicly accessible
            via GET /api/v1/share/{token}. Null means sharing is disabled.

    Scene:
      allOf:
        - $ref: "#/components/schemas/SceneSummary"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/SceneData"

    SceneInput:
      type: object
      required: [name, data]
      properties:
        name:
          type: string
          description: Human-readable scene name
        data:
          $ref: "#/components/schemas/SceneData"

    SceneRenameInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: New scene name

    SceneData:
      type: object
      description: Scene content as stored by the frontend
      required: [version, items, groups]
      properties:
        version:
          type: integer
          description: Snapshot format version
          example: 1
        room:
          type: object
          description: Room dimensions in mm. If absent, defaults are used (4000x4000x3000).
          required: [width, depth, height]
          properties:
            width:
              type: integer
              minimum: 1000
              maximum: 50000
            depth:
              type: integer
              minimum: 1000
              maximum: 50000
            height:
              type: integer
              minimum: 1000
              maximum: 10000
        items:
          type: array
          description: Scene items (furniture, panels, etc.)
          items:
            $ref: "#/components/schemas/SceneItem"
        groups:
          type: array
          description: Item groups
          items:
            $ref: "#/components/schemas/SceneGroup"

    SceneItem:
      type: object
      description: Opaque scene item — shape defined by frontend SceneItem type
      additionalProperties: true

    SceneGroup:
      type: object
      description: Opaque scene group — shape defined by frontend SceneGroup type
      additionalProperties: true

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Human-readable error message
