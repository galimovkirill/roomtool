services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend:/workspace/apps/frontend
      - frontend_nm:/workspace/node_modules          # изолированы от хоста, не перезаписываются bind-mount'ом
      - frontend_app_nm:/workspace/apps/frontend/node_modules  # симлинки из apps/frontend/node_modules не просочатся с хоста
    environment:
      CHOKIDAR_USEPOLLING: "true"
      BACKEND_URL: "http://backend:8080"

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - ./apps/backend:/app
      - go_mod_cache:/root/go/pkg/mod   # кэш модулей между перезапусками
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://roomtool:roomtool@db:5432/roomtool?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: roomtool
      POSTGRES_USER: roomtool
      POSTGRES_PASSWORD: roomtool
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomtool"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

volumes:
  frontend_nm:
  frontend_app_nm:
  go_mod_cache:
  postgres_dev_data:
